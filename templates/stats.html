<!DOCTYPE html>
<html>
<head>
  <title>Progress Stats</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h1>Your Progress</h1>
  <p>Words in deck: {{ total_words }} &nbsp;&nbsp; Words reviewed at least once: {{ words_reviewed }}</p>

  <form method="get" action="{{ url_for('stats') }}" class="filter-bar">
    <label for="level">Filter by level:</label>
    <select id="level" name="level" onchange="this.form.submit()">
      <option value="" {% if not selected_level %}selected{% endif %}>All levels</option>
      {% for lvl in jlpt_levels %}
        <option value="{{ lvl }}" {% if selected_level == lvl %}selected{% endif %}>{{ lvl }}</option>
      {% endfor %}
    </select>
  </form>

  <div class="chart-container">
    <canvas id="progressChart" width="600" height="300"></canvas>
  </div>

  <a href="{{ url_for('index') }}">Back to word list</a>

  <script>
    const ctx = document.getElementById('progressChart');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: {{ labels|safe }},
        datasets: [
          { label: 'Correct', data: {{ correct|safe }}, backgroundColor: '#4caf50' },
          { label: 'Incorrect', data: {{ incorrect|safe }}, backgroundColor: '#e53935' }
        ]
      },
      options: {
        responsive: false,
        scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } }
      }
    });
  </script>
</body>
</html>
