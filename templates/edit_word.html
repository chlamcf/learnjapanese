<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Word</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Edit Word</h1>

    <form method="POST" action="{{ url_for('edit_word', word_id=word.id) }}">
        <div class="form-group">
            <label>Word:</label>
            <input type="text" name="word" value="{{ word.word }}" required>
        </div>

        <div class="form-group">
            <label>Reading:</label>
            <input type="text" name="reading" value="{{ word.reading }}" required>
        </div>

        <div class="form-group">
            <label>Meaning:</label>
            <input type="text" name="meaning" value="{{ word.meaning }}" required>
        </div>

        <div class="form-group">
            <label>JLPT Level:</label>
            <select name="category">
                <option value="" {% if not current_level %}selected{% endif %}>— None —</option>
                {% for lvl in jlpt_levels %}
                <option value="{{ lvl }}" {% if current_level == lvl %}selected{% endif %}>{{ lvl }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit">Save Changes</button>
    </form>

    <p><a href="{{ url_for('index') }}">← Back to list</a></p>
</body>
</html>
