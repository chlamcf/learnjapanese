<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Word</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Add New Word</h1>

    <form method="POST" action="{{ url_for('add_word') }}">
        <label>Word:</label><br>
        <input type="text" name="word" required><br><br>

        <label>Reading:</label><br>
        <input type="text" name="reading" required><br><br>

        <label>Meaning:</label><br>
        <input type="text" name="meaning" required><br><br>

        <label>Category:</label><br>
        <input type="text" name="category"><br><br>

        <button type="submit">Add Word</button>
    </form>

    <p><a href="{{ url_for('index') }}">← Back to list</a></p>
</body>
</html>
