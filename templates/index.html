<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>learnjapanese</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Vocabulary List</h1>

  <nav class="action-bar">
    <a href="{{ url_for('add_word') }}" class="btn">Add New Word</a>
    <a href="{{ url_for('quiz') }}" class="btn">Take a Quiz</a>
    <a href="{{ url_for('stats') }}" class="btn">View Progress</a>
  </nav>

  <table>
    <thead>
      <tr>
        <th>Word</th>
        <th>Reading</th>
        <th>Meaning</th>
        <th>Category</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for w in words %}
      <tr>
        <td>{{ w.word }}</td>
        <td>{{ w.reading }}</td>
        <td>{{ w.meaning }}</td>
        <td>{{ w.category }}</td>
        <td>
          <a href="{{ url_for('edit_word', word_id=w.id) }}">Edit</a>
<form action="{{ url_for('delete_word', word_id=w.id) }}" method="POST" style="display:inline">
  <button type="submit" class="link-btn" onclick="return confirm('Delete this word?')">Delete</button>
</form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
