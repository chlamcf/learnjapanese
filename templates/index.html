<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Japanese Vocabulary List</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Japanese Vocabulary List</h1>

  <p>
    <a href="{{ url_for('add_word') }}">Add New Word</a>
    <a href="{{ url_for('quiz') }}">Take a Quiz</a>
    <a href="{{ url_for('stats') }}">View Progress</a>
  </p>

  <table>
    <thead>
      <tr>
        <th>Word</th>
        <th>Reading</th>
        <th>Meaning</th>
        <th>Category</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for w in words %}
      <tr>
        <td>{{ w.word }}</td>
        <td>{{ w.reading }}</td>
        <td>{{ w.meaning }}</td>
        <td>{{ w.category }}</td>
        <td>
          <a href="{{ url_for('edit_word', word_id=w.id) }}">Edit</a>
          <form action="{{ url_for('delete_word', word_id=w.id) }}" method="POST" style="display:inline">
            <button type="submit" onclick="return confirm('Delete this word?')">Delete</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
